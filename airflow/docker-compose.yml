version: "3.8"

# NYC Taxi Trust Layer — Airflow local development environment
# Usage: docker-compose up -d
# Airflow UI: http://localhost:8080 (admin / admin)

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.4-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__SECRET_KEY: "nyc-taxi-trust-layer"
    # Pass GCP and Anthropic credentials into the container
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GCS_BUCKET: ${GCS_BUCKET}
    GCS_WAREHOUSE_PATH: ${GCS_WAREHOUSE_PATH}
    BQ_DATASET: ${BQ_DATASET}
    BQ_LOCATION: ${BQ_LOCATION}
    ICEBERG_CATALOG: ${ICEBERG_CATALOG}
    ICEBERG_DATABASE: ${ICEBERG_DATABASE}
    ICEBERG_TABLE: ${ICEBERG_TABLE}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    INGEST_TARGETS: ${INGEST_TARGETS}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/service-account.json
  volumes:
    - ./dags:/opt/airflow/dags
    - ../dbt:/opt/airflow/dbt
    - ../ingestion:/opt/airflow/ingestion
    - ../enrichment:/opt/airflow/enrichment
    - ../config:/opt/airflow/config
    - ../logs:/opt/airflow/logs
    - ${GOOGLE_APPLICATION_CREDENTIALS}:/opt/airflow/secrets/service-account.json:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        pip install -r /opt/airflow/requirements.txt &&
        airflow db migrate &&
        airflow users create
          --username admin
          --password admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@example.com
      "
    volumes:
      - ../requirements.txt:/opt/airflow/requirements.txt
      - *airflow-common

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
